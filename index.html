      --primary-dark: #115e59;
      --accent: #0284c7;
      --border: #dce4ee;
      --chip: #eef6f5;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);

      --card: #131c31;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #14b8a6;
      --primary-dark: #0d9488;
      --accent: #38bdf8;
      --border: #24324d;
      --chip: #192942;
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.14);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background 0.25s, color 0.25s;
    }
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary), var(--accent));
      color: #fff;
      padding: 20px 16px 24px;
      box-shadow: var(--shadow);
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 14px; }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.45rem; }
    .subtitle { margin: 6px 0 0; opacity: 0.92; font-size: 0.95rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button, select, input {
      font-family: inherit;
      font-size: 0.92rem;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      background: rgba(255,255,255,0.18);
      color: #fff;
      backdrop-filter: blur(6px);
      transition: 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.28); }
    .btn-solid {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-solid:hover { background: var(--primary-dark); }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 9px;
      padding: 6px 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }
    .tab-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: var(--shadow);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .control {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      width: 100%;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 8px; color: var(--primary); font-size: 1.1rem; }
    .card h4 { margin: 12px 0 6px; font-size: 0.98rem; color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip {
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
    }
    .warn-box {
      background: var(--warn-bg);
      color: var(--warn);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      margin: 8px 0;
    }
    ul { margin: 6px 0; padding-right: 20px; }
    li { margin-bottom: 4px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.86rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 7px 9px;
      text-align: right;
    }
    th { background: var(--chip); color: var(--primary); }
    .kit-svg-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 10px;
      margin: 10px 0;
      cursor: zoom-in;
      border: 1px solid var(--border);
      text-align: center;
    }
    .kit-svg-box span {
      display: block;
      color: #cbd5e1;
      font-size: 0.78rem;
      margin-top: 4px;
    }
    .video-box {
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
    }
    .video-box iframe {
      width: 100%;
      height: 210px;
      border: 0;
      display: block;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: var(--card);
      color: var(--text);
      max-width: 780px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      border-radius: 16px;
      padding: 18px;
      position: relative;
    }
    .close-btn {
      position: sticky;
      top: 0;
      float: left;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 700;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    footer {
      margin-top: 32px;
      padding: 18px 14px 28px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>

    <!-- القسم الثاني -->

      </div>
      <div id="surgeriesContainer" class="grid"></div>
    </section>

    <!-- القسم الثالث -->
    <section id="tab-wards" class="panel">
      <div id="wardsContainer" class="grid"></div>
    </section>
  </main>

    function renderKitSVG(title, tools) {
      const itemsText = tools.slice(0, 4).map((t, idx) =>
        `<text x="20" y="${78 + idx * 24}" fill="#e2e8f0" font-size="13" font-family="Tahoma, Arial">${idx + 1}. ${escapeHtml(t)}</text>`

      return `
        <svg viewBox="0 0 600 185" width="100%" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="592" height="177" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

          <circle cx="515" cy="95" r="24" fill="none" stroke="#14b8a6" stroke-width="2.5"/>
          <line x1="532" y1="112" x2="568" y2="148" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>
          <line x1="568" y1="112" x2="532" y2="148" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>
        </svg>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

      specSelect.appendChild(opt);
    });

    function renderGovs() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const selectedGov = govSelect.value;
      const container = document.getElementById("govsContainer");
      container.innerHTML = "";

      const filtered = GOVERNORATES.filter(g => {
        if (selectedGov !== "ALL" && g.name !== selectedGov) return false;
        if (!q) return true;
        const blob = [
          g.name,
          ...g.directorates,
          ...g.sectors,
          ...g.hospitals.flatMap(h => [h.name, h.type, ...h.units])
        ].join(" ").toLowerCase();
        return blob.includes(q);
      });

      filtered.forEach(g => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>محافظة ${escapeHtml(g.name)}</h3>
          <div><strong>دوائر الصحة:</strong> ${g.directorates.map(d => `<span class="chip">${escapeHtml(d)}</span>`).join(" ")}</div>
          <h4>القطاعات الصحية في الأقضية والنواحي</h4>
          <div class="chips">${g.sectors.map(s => `<span class="chip">${escapeHtml(s)}</span>`).join("")}</div>
          <h4>المستشفيات والوحدات</h4>
          ${g.hospitals.map(h => `
            <div style="border-top:1px dashed var(--border); padding-top:8px; margin-top:8px;">
              <strong>${escapeHtml(h.name)}</strong> <span class="chip">${escapeHtml(h.type)} • ${h.beds} سرير</span>
              <ul>${h.units.map(u => `<li>${escapeHtml(u)}</li>`).join("")}</ul>
            </div>
          `).join("")}
        `;
        container.appendChild(card);
      });
    }

          <p><strong>الأجهزة القياسية:</strong> ${escapeHtml(s.devices)}</p>

          <h4>الست الجراحي والأدوات (${escapeHtml(s.kitName)})</h4>
          <div class="kit-svg-box" data-kit-idx="${idx}" title="اضغط لتكبير الست الجراحي">
            ${svgMarkup}
            <span>اضغط على الصورة لتكبير الست الجراحي وعرض تفاصيل الأدوات</span>
          </div>
          <ul>${s.tools.map(t => `<li>${escapeHtml(t)}</li>`).join("")}</ul>

          <h4>خطوات العملية الجراحية القياسية</h4>
          <ol style="margin:6px 0; padding-right:20px;">${s.steps.map(st => `<li>${escapeHtml(st)}</li>`).join("")}</ol>

          <h4>الخيوط الجراحية حسب الطبقات</h4>
          <table>
            <thead>
              <tr><th>الطبقة</th><th>نوع الخيط</th><th>الإبرة</th></tr>
            </thead>
            <tbody>
              ${s.sutures.map(su => `
                <tr>
                  <td>${escapeHtml(su.layer)}</td>
                  <td>${escapeHtml(su.material)}</td>
                  <td>${escapeHtml(su.needle)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>

          <h4>فيديو تعليمي قياسي</h4>
          <div class="video-box">
            <iframe src="https://www.youtube.com/embed/${escapeURIComponent(s.videoId)}" title="${escapeHtml(s.title)}" allowfullscreen></iframe>
          </div>
          <div style="margin-top:8px;">
            <a class="btn-outline" style="display:inline-block; text-decoration:none;" href="https://www.youtube.com/watch?v=${encodeURIComponent(s.videoId)}" target="_blank" rel="noopener">فتح على يوتيوب</a>
          </div>
        `;
        container.appendChild(card);
      });

      document.querySelectorAll(".kit-svg-box").forEach(box => {
        box.addEventListener("click", () => {
          const item = list[Number(box.dataset.kitIdx)];
          openModal(`
            <button class="close-btn" id="closeModalBtn">إغلاق</button>
            <h3>${escapeHtml(item.title)} — ${escapeHtml(item.kitName)}</h3>
            ${renderKitSVG(item.kitName, item.tools)}
            <h4>قائمة الأدوات في السيت:</h4>
            <ul>${item.tools.map(t => `<li>${escapeHtml(t)}</li>`).join("")}</ul>
          `);
        });
      });
    }

    function renderWards() {
      const container = document.getElementById("wardsContainer");
      container.innerHTML = "";
      WARDS.forEach(w => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>${escapeHtml(w.title)}</h3>
          <p><strong>أنواع المرضى المستلمين:</strong> ${escapeHtml(w.patients)}</p>
          <p><strong>الأجهزة والتجهيزات القياسية:</strong> ${escapeHtml(w.devices)}</p>
          ${w.protocol ? `<div class="warn-box"><strong>آلية العمل:</strong> ${escapeHtml(w.protocol)}</div>` : ""}
        `;
        container.appendChild(card);
      });
    }

    function openModal(html) {
      const modalBody = document.getElementById("modalBody");
      modalBody.innerHTML = html;
      document.getElementById("modalBox").classList.add("open");
      document.getElementById("closeModalBtn")?.addEventListener("click", closeModal);
    }

    function closeModal() {
      document.getElementById("modalBox").classList.remove("open");
    }

    document.getElementById("modalBox").addEventListener("click", e => {
      if (e.target.id === "modalBox") closeModal();
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      document.getElementById("themeBtn").textContent =
        document.body.classList.contains("dark") ? "الوضع النهاري" : "الوضع الليلي";
    });

    document.getElementById("addHospBtn").addEventListener("click", () => {
      const govOptions = GOVERNORATES.map(g => `<option value="${escapeHtml(g.name)}">${escapeHtml(g.name)}</option>`).join("");
      openModal(`
        <button class="close-btn" id="closeModalBtn">إغلاق</button>
        <h3>إضافة مستشفى جديد</h3>
        <form id="hospForm" class="form-grid">
          <select name="gov" class="control">${govOptions}</select>
          <input type="text" name="name" class="control" placeholder="اسم المستشفى" required />
          <input type="text" name="type" class="control" placeholder="النوع (عام / تعليمي / تخصصي)" value="عام" />
          <input type="number" name="beds" class="control" placeholder="عدد الأسرة" value="120" />
          <input type="text" name="units" class="control" style="grid-column:1/-1" placeholder="الوحدات مفصولة بفاصلة (مثال: صالات عمليات، ردهات، مفرز، أشعة)" />
          <div style="grid-column:1/-1">
            <button type="submit" class="btn-solid">حفظ المستشفى</button>
          </div>
        </form>
      `);
      document.getElementById("hospForm").addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newHosp = {
          gov: fd.get("gov"),
          name: fd.get("name").trim(),
          type: fd.get("type").trim() || "عام",
          beds: Number(fd.get("beds")) || 100,
          units: String(fd.get("units") || "صالات عمليات، ردهات عامة، المفرز الطبي، الأشعة والمختبر")
            .split("،").join(",").split(",").map(x => x.trim()).filter(Boolean)
        };
        const targetGov = GOVERNORATES.find(g => g.name === newHosp.gov);
        if (targetGov && newHosp.name) {
          targetGov.hospitals.push({ name: newHosp.name, type: newHosp.type, beds: newHosp.beds, units: newHosp.units });
          const currentExtra = JSON.parse(localStorage.getItem("iraq_extra_hospitals") || "[]");
          currentExtra.push(newHosp);
          localStorage.setItem("iraq_extra_hospitals", JSON.stringify(currentExtra));
          renderGovs();
          closeModal();
        }
      });
    });

    document.getElementById("searchInput").addEventListener("input", renderGovs);
    govSelect.addEventListener("change", renderGovs);
    specSelect.addEventListener("change", renderSurgeries);
    document.getElementById("surgerySearch").addEventListener("input", renderSurgeries);

    renderGovs();
    renderSurgeries();
    renderWards();
  </script>
</body>
</html>
