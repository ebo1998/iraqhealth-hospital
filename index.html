<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f4f7fa;
      --card: #ffffff;
      --text: #14213d;
      --muted: #5c6b82;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #0284c7;
      --border: #dce4ee;
      --chip: #eef6f5;
      --warn: #92400e;
      --warn-bg: #fef3c7;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    body.dark {
      --bg: #0b1220;
      --card: #131c31;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #14b8a6;
      --primary-dark: #0d9488;
      --accent: #38bdf8;
      --border: #24324d;
      --chip: #192942;
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.14);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background 0.25s, color 0.25s;
    }
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary), var(--accent));
      color: #fff;
      padding: 20px 16px 24px;
      box-shadow: var(--shadow);
    }
    .wrap { max-width: 1220px; margin: 0 auto; padding: 0 14px; }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.42rem; }
    .subtitle { margin: 6px 0 0; opacity: 0.94; font-size: 0.94rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button, select, input {
      font-family: inherit;
      font-size: 0.92rem;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 8px 13px;
      cursor: pointer;
      font-weight: 600;
      background: rgba(255,255,255,0.18);
      color: #fff;
      transition: 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.28); }
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .lang-btn {
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(0,0,0,0.15);
      color: #fff;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #fff;
      color: var(--primary-dark);
      font-weight: 700;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }
    .tab-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: var(--shadow);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .control {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      width: 100%;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 8px; color: var(--primary); font-size: 1.1rem; }
    .card h4 { margin: 12px 0 6px; font-size: 0.98rem; color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip {
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
    }
    .item-btn {
      display: block;
      width: 100%;
      text-align: inherit;
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      margin-top: 7px;
      cursor: pointer;
      font-weight: 600;
    }
    .item-btn:hover {
      border-color: var(--primary);
      background: rgba(15, 118, 110, 0.09);
    }
    .link-btn {
      display: inline-block;
      text-decoration: none;
      background: var(--primary);
      color: #fff;
      border-radius: 9px;
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 600;
      margin: 4px 4px 0 0;
    }
    .link-btn.sec {
      background: var(--accent);
    }
    .warn-box {
      background: var(--warn-bg);
      color: var(--warn);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      margin: 8px 0;
    }
    ul, ol { margin: 6px 0; padding-right: 20px; }
    li { margin-bottom: 4px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 7px 9px;
      text-align: start;
    }
    th { background: var(--chip); color: var(--primary); }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: var(--card);
      color: var(--text);
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      border-radius: 16px;
      padding: 18px;
      position: relative;
    }
    .close-btn {
      position: sticky;
      top: 0;
      float: left;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 700;
    }
    footer {
      margin-top: 32px;
      padding: 18px 14px 28px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>

  <header>

        </div>
        <div class="actions">

          <button class="btn" id="emergencyBtn">أرقام الطوارئ</button>
        </div>
      </div>
      <div class="lang-bar" id="langBar">
        <button class="lang-btn active" data-lang="ar">العربية</button>
        <button class="lang-btn" data-lang="ku">کوردی (کوردی)</button>
        <button class="lang-btn" data-lang="tk">Türkmençe (ترکمنچە)</button>
        <button class="lang-btn" data-lang="en">English</button>
        <button class="lang-btn" data-lang="sy">ܣܘܪܝܝܐ (المسيحية/السريانية)</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" id="tabsBar">

      <button class="tab-btn" data-tab="or">صالات العمليات والسيتات والفيديوهات</button>
      <button class="tab-btn" data-tab="labs">المختبرات والفحوصات</button>
      <button class="tab-btn" data-tab="rad">الأشعة والمفراس والرنين</button>
      <button class="tab-btn" data-tab="pharm">الصيدليات وعلاجات كركوك والأورام</button>
      <button class="tab-btn" data-tab="ops">المواطنون والعمال والهندسة</button>
    </nav>

    <section id="tab-govs" class="panel active">

    <section id="tab-or" class="panel">

        </select>
        <input type="text" id="orSearch" class="control" placeholder="ابحث عن عملية، سيت، خيط، قسطرة، أو جهاز..." />
      </div>
      <div id="orContainer" class="grid"></div>
    </section>

    <section id="tab-labs" class="panel">
      <div id="labsContainer" class="grid"></div>
    </section>

    <section id="tab-rad" class="panel">
      <div id="radContainer" class="grid"></div>
    </section>

    <section id="tab-pharm" class="panel">
      <div id="pharmContainer" class="grid"></div>
    </section>

    <section id="tab-ops" class="panel">
      <div id="opsContainer" class="grid"></div>
    </section>
  </main>

  <div class="modal" id="modalBox">
    <div class="modal-content" id="modalBody"></div>
  </div>

    <div>دليل صحي متكامل للقطاع الصحي العراقي — للمواطن والطلبة والكوادر</div>

          "منطقة أمان مغناطيسي صارمة (Zones I–IV): يُمنع دخول أي معادن أو أجهزة مزروعة غير متوافقة مع MRI (مثل Pacemaker أو شظايا معدنية في العين).",
          "تعبئة استمارة فحص الأمان المغناطيسي بدقة قبل دخول الغرفة، وتوفير واقيات للأذن بسبب الضجيج المغناطيسي.",
          "التهوية، نظام الطوارئ غير المغناطيسي، وتقييم الكلى قبل إعطاء صبغة الغادولينيوم (Gadolinium) عند الحاجة."
        ]
      }
    ];

    const PHARM_CARDS = [
      {
        title: "الصيدليات داخل المستشفيات وعلاجات كركوك",
        content: "توفر صيدليات المستشفيات في كركوك (مثل مستشفى كركوك العام ومستشفى النسائية والأطفال والقطاعات) الأدوية المنقذة للحياة، المضادات الحيوية، السوائل الوريدية، المسكنات، وأدوية الطوارئ والعمليات حسب قوائم وزارة الصحة العراقية، بينما تُصرف الأدوية المزمنة والخاصة وفق الضوابط والوصفات المعتمدة."
      },
      {
        title: "مستشفيات الأورام وعلاجات مرضى السرطان",
        content: "تُقدّم مراكز ومستشفيات الأورام بروتوكولات علاجية متخصصة بإشراف أطباء الأورام والصيادلة السريريين وتشمل: العلاج الكيميائي (Chemotherapy)، العلاج الموجه (Targeted Therapy)، العلاج الهرموني، العلاج المناعي، والعلاج الداعم (مضادات الإقياء، خفض الالتهاب، ودعم الدم)."
      }
    ];

    const OPS_CARDS = [
      {
        title: "آلية عمل المستشفيات، خدمة المواطنين، والعمال",
        content: "يبدأ المراجع عبر المفرز/الاستعلامات أو العيادات الاستشارية، ثم يُوجّه للفحوصات أو الصيدلية أو الردهة أو العمليات. تقوم شعبة خدمة المواطنين باستقبال الشكاوى والمقترحات وتوجيه المراجعين، بينما يتولى العمال النظافة والتعقيم ونقل المرضى والسلامة العامة."
      },
      {
        title: "الكوادر الإدارية والتمريضية والطبية في المستشفيات والقطاعات",
        content: "<ul>" + STAFF_ROLES.map(r => `<li>${r}</li>`).join("") + "</ul>"
      },
      {
        title: "الأقسام الهندسية، تشغيل الأجهزة، وعند تعطل الآلات",
        content: "تضم المستشفيات وحدة الهندسة الطبية وصيانة الأبنية والكهرباء والتبريد. عند تعطل أي جهاز طبي: يتم إيقافه بأمان ووضع إشارة (خارج الخدمة / Out of Service)، إبلاغ الهندسة الطبية، فحص مصدر الطاقة والملحقات، إجراء الصيانة أو طلب قطع الغيار، وإعادة معايرته واختبار أمانه قبل إرجاعه للعمل."
      }
    ];

    function esc(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function openModal(html) {
      document.getElementById("modalBody").innerHTML = `<button class="close-btn" id="closeModalBtn">إغلاق</button>` + html;
      document.getElementById("modalBox").classList.add("open");
      document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    }
    function closeModal() {
      document.getElementById("modalBox").classList.remove("open");
    }
    document.getElementById("modalBox").addEventListener("click", e => {
      if (e.target.id === "modalBox") closeModal();
    });

    const govSelect = document.getElementById("govSelect");
    GOVERNORATES.forEach((g, idx) => {
      const opt = document.createElement("option");
      opt.value = g.name;
      opt.textContent = `${idx + 1}. ${g.name}`;
      govSelect.appendChild(opt);
    });

    function renderGovs() {
      const q = document.getElementById("govSearch").value.trim().toLowerCase();
      const sel = govSelect.value;
      const box = document.getElementById("govsContainer");
      box.innerHTML = "";

      GOVERNORATES.forEach((g, gIdx) => {
        if (sel !== "ALL" && g.name !== sel) return;
        const text = [g.name, g.directorate, ...g.sectors.map(s=>s.name), ...g.hospitals.flatMap(h=>[h.name, ...h.departments])].join(" ").toLowerCase();
        if (q && !text.includes(q)) return;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>${gIdx + 1}. محافظة ${esc(g.name)}</h3>
          <div class="chip">${esc(g.directorate)}</div>
          <div style="margin-top:8px;">
            <a class="link-btn" href="${esc(g.gps)}" target="_blank" rel="noopener">موقع المحافظة GPS</a>
            <span class="chip">طوارئ: ${esc(g.emergencyPhone)}</span>
          </div>
          <h4>القطاعات الصحية بالتسلسل</h4>
          ${g.sectors.map((s, sIdx) => `
            <button class="item-btn sector-btn" data-g="${gIdx}" data-s="${sIdx}">${sIdx + 1}. ${esc(s.name)} — عرض الموقع والخدمات</button>
          `).join("")}
          <h4>المستشفيات بالتسلسل (اضغط للدخول إلى الأقسام)</h4>
          ${g.hospitals.map((h, hIdx) => `
            <button class="item-btn hosp-btn" data-g="${gIdx}" data-h="${hIdx}">${hIdx + 1}. ${esc(h.name)} (${esc(h.type)})</button>
          `).join("")}
        `;
        box.appendChild(card);
      });

      box.querySelectorAll(".sector-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const g = GOVERNORATES[Number(btn.dataset.g)];
          const s = g.sectors[Number(btn.dataset.s)];
          openModal(`
            <h3>${esc(s.name)} — محافظة ${esc(g.name)}</h3>
            <p>يتبع ${esc(g.directorate)} ويقدم خدمات الرعاية الأولية، الطوارئ البسيطة، التحصين، المتابعة، والتحويل إلى المستشفيات.</p>
            <p><strong>رقم الطوارئ:</strong> ${esc(g.emergencyPhone)}</p>
            <a class="link-btn" href="${esc(s.gps)}" target="_blank" rel="noopener">فتح موقع القطاع على الخريطة (GPS)</a>
            <h4>الكوادر العاملة في القطاع:</h4>
            <ul>${STAFF_ROLES.map(r => `<li>${r}</li>`).join("")}</ul>
          `);
        });
      });

      box.querySelectorAll(".hosp-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const g = GOVERNORATES[Number(btn.dataset.g)];
          const h = g.hospitals[Number(btn.dataset.h)];
          openModal(`
            <h3>${esc(h.name)}</h3>
            <div class="chip">المحافظة: ${esc(g.name)}</div>
            <div class="chip">النوع: ${esc(h.type)}</div>
            <div class="chip">طوارئ: ${esc(h.emergencyPhone)}</div>
            <div style="margin-top:10px;">
              <a class="link-btn" href="${esc(h.gps)}" target="_blank" rel="noopener">موقع المستشفى GPS</a>
            </div>
            <h4>أقسام المستشفى بالتسلسل:</h4>
            <ol>${h.departments.map(d => `<li>${esc(d)}</li>`).join("")}</ol>
            <h4>الكوادر الإدارية والتمريضية والطبية والخدمية:</h4>
            <ul>${STAFF_ROLES.map(r => `<li>${r}</li>`).join("")}</ul>
          `);
        });
      });
    }

    function renderOR() {
      const cat = document.getElementById("orFilter").value;
      const q = document.getElementById("orSearch").value.trim().toLowerCase();
      const box = document.getElementById("orContainer");
      box.innerHTML = "";

      OR_SECTIONS.forEach(item => {
        if (cat !== "ALL" && item.category !== cat) return;
        const blob = [item.title, item.surgeries, item.kits, item.sutures, item.cathetersAndAnesthesia, item.devices, ...item.toolsWithLinks.map(t=>t.name)].join(" ").toLowerCase();
        if (q && !blob.includes(q)) return;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>${esc(item.title)}</h3>
          <div style="margin-bottom:8px;">
            <a class="link-btn" href="${esc(item.roomImgSearch)}" target="_blank" rel="noopener">صورة صالة العمليات</a>
            <a class="link-btn sec" href="${esc(item.videoSearch)}" target="_blank" rel="noopener">فيديوهات تعليمية للعملية</a>
          </div>
          <p><strong>العمليات الموجودة:</strong> ${esc(item.surgeries)}</p>
          <p><strong>السيتات الجراحية:</strong> ${esc(item.kits)}</p>
          <h4>أدوات السيت وصورها من الإنترنت:</h4>
          <ul>
            ${item.toolsWithLinks.map(t => `<li>${esc(t.name)} — <a href="${esc(t.imgUrl)}" target="_blank" rel="noopener">عرض صورة الأداة</a></li>`).join("")}
          </ul>
          <p><strong>الخيوط الجراحية:</strong> ${esc(item.sutures)}</p>
          <p><strong>القسطرة وصوندات التخدير:</strong> ${esc(item.cathetersAndAnesthesia)}</p>
          <p><strong>الأجهزة في صالة العمليات:</strong> ${esc(item.devices)}</p>
          <div class="warn-box"><strong>خطوة تعليمية للطلاب والدراسات:</strong> ${esc(item.studyGuide)}</div>
        `;
        box.appendChild(card);
      });
    }

    function renderLabs() {
      const box = document.getElementById("labsContainer");
      box.innerHTML = LAB_CARDS.map(l => `
        <div class="card">
          <h3>${esc(l.title)}</h3>
          <p>${esc(l.details)}</p>
          <h4>أنواع الفحوصات وطرق أخذ العينات:</h4>
          <ul>${l.testsAndMethods.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        </div>
      `).join("");
    }

    function renderRad() {
      const box = document.getElementById("radContainer");
      box.innerHTML = RAD_CARDS.map(r => `
        <div class="card">
          <h3>${esc(r.title)}</h3>
          <ul>${r.standards.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
        </div>
      `).join("");
    }

    function renderPharm() {
      const box = document.getElementById("pharmContainer");
      box.innerHTML = PHARM_CARDS.map(p => `
        <div class="card">
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.content)}</p>
        </div>
      `).join("");
    }

    function renderOps() {
      const box = document.getElementById("opsContainer");
      box.innerHTML = OPS_CARDS.map(o => `
        <div class="card">
          <h3>${esc(o.title)}</h3>
          <div>${o.content}</div>
        </div>
      `).join("");
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      document.getElementById("themeBtn").textContent =
        document.body.classList.contains("dark") ? "الوضع النهاري" : "الوضع الليلي";
    });

    document.getElementById("emergencyBtn").addEventListener("click", () => {
      openModal(`
        <h3>أرقام الطوارئ والمواقع في العراق</h3>
        <p><strong>رقم الطوارئ والاسعاف الموحد في العراق:</strong> 122</p>
        <table>
          <thead><tr><th>المحافظة</th><th>الطوارئ</th><th>الموقع (GPS)</th></tr></thead>
          <tbody>
            ${GOVERNORATES.map(g => `
              <tr>
                <td>${esc(g.name)}</td>
                <td>${esc(g.emergencyPhone)}</td>
                <td><a href="${esc(g.gps)}" target="_blank" rel="noopener">فتح الخريطة</a></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `);
    });

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const cfg = LANG_LABELS[btn.dataset.lang] || LANG_LABELS.ar;
        document.documentElement.dir = cfg.dir;
        document.getElementById("appTitle").textContent = cfg.title;
        document.getElementById("appSub").textContent = cfg.sub;
      });
    });

    document.getElementById("govSearch").addEventListener("input", renderGovs);
    govSelect.addEventListener("change", renderGovs);
    document.getElementById("orFilter").addEventListener("change", renderOR);
    document.getElementById("orSearch").addEventListener("input", renderOR);

    renderGovs();
    renderOR();
    renderLabs();
    renderRad();
    renderPharm();
    renderOps();
  </script>
</body>
</html>
